<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Neon Gradients & Filters -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0077" />
      <stop offset="100%" stop-color="#9d00ff" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" stroke-dasharray="10 5" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#neonPink)" stroke-width="1.5" opacity="0.2" />

  <!-- Cybernetic Crosshairs -->
  <line x1="250" y1="20" x2="250" y2="70" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>
  <line x1="250" y1="430" x2="250" y2="480" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>
  <line x1="20" y1="250" x2="70" y2="250" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>
  <line x1="430" y1="250" x2="480" y2="250" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>

  <!-- Cranium Outline -->
  <path d="M 120 220 
           C 120 120, 180 80, 250 80 
           C 320 80, 380 120, 380 220 
           C 380 280, 350 310, 340 330 
           C 335 340, 330 360, 310 380 
           L 190 380 
           C 170 360, 165 340, 160 330 
           C 150 310, 120 280, 120 220 Z" 
        fill="#0a0a14" 
        stroke="url(#neonCyan)" 
        stroke-width="5" 
        filter="url(#glow)" />

  <!-- Forehead Cyber Markings -->
  <polygon points="250,110 230,150 270,150" fill="none" stroke="#ff0077" stroke-width="3" filter="url(#glow)"/>
  <line x1="210" y1="130" x2="170" y2="130" stroke="#00f3ff" stroke-width="2" />
  <line x1="290" y1="130" x2="330" y2="130" stroke="#00f3ff" stroke-width="2" />

  <!-- Eye Sockets with Glowing Pupil Nodes -->
  <path d="M 170 200 C 160 250, 210 270, 220 230 C 220 200, 190 180, 170 200 Z" 
        fill="#05050d" stroke="url(#neonPink)" stroke-width="4" filter="url(#glow)" />
  <circle cx="195" cy="225" r="7" fill="#00f3ff" filter="url(#glow)" class="skull-eye" />

  <path d="M 330 200 C 340 250, 290 270, 280 230 C 280 200, 310 180, 330 200 Z" 
        fill="#05050d" stroke="url(#neonPink)" stroke-width="4" filter="url(#glow)" />
  <circle cx="305" cy="225" r="7" fill="#00f3ff" filter="url(#glow)" class="skull-eye" />

  <!-- Inverted Heart / Cyber Nasal Cavity -->
  <polygon points="250,260 235,295 265,295" fill="#05050d" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>

  <!-- Cheekbones Structure -->
  <path d="M 130 240 L 170 280 L 175 320" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.7"/>
  <path d="M 370 240 L 330 280 L 325 320" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.7"/>

  <!-- Teeth / Jaw Section -->
  <g class="skull-jaw" stroke="#00f3ff" stroke-width="3" fill="#0c0c1a" filter="url(#glow)">
    <!-- Upper Teeth -->
    <rect x="200" y="340" width="16" height="24" rx="3" />
    <rect x="222" y="340" width="16" height="26" rx="3" />
    <rect x="244" y="340" width="16" height="26" rx="3" />
    <rect x="266" y="340" width="16" height="26" rx="3" />
    <rect x="288" y="340" width="16" height="24" rx="3" />

    <!-- Lower Jaw / Teeth -->
    <rect x="205" y="375" width="15" height="20" rx="3" stroke="#ff0077" />
    <rect x="225" y="375" width="15" height="22" rx="3" stroke="#ff0077" />
    <rect x="245" y="375" width="15" height="22" rx="3" stroke="#ff0077" />
    <rect x="265" y="375" width="15" height="22" rx="3" stroke="#ff0077" />
    <rect x="285" y="375" width="15" height="20" rx="3" stroke="#ff0077" />
  </g>

  <!-- Cyber Nodes on Temples -->
  <circle cx="140" cy="180" r="4" fill="#00ff9d" filter="url(#glow)" />
  <circle cx="360" cy="180" r="4" fill="#00ff9d" filter="url(#glow)" />
</svg>
