<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>شبح | SHABAH NEON PLATFORM</title>
  <!-- Telegram WebApp Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/neon.css">
  <link rel="icon" type="image/svg+xml" href="/static/assets/skull.svg">
</head>
<body>

  <div class="shabah-container">
    <!-- Header HUD with Neon Skull -->
    <header class="shabah-header">
      <div class="skull-avatar-wrap">
        <img src="/static/assets/skull.svg" alt="Shabah Skull" id="mainSkull">
      </div>
      <h1 class="title-glow">شــبــح</h1>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>مشفر • اتصال مباشر مع المطور</span>
      </div>
    </header>

    <!-- Call Action Request Bar -->
    <div class="call-actions-bar">
      <button id="callVoiceBtn" class="btn-neon-action">
        <span>🎙️</span>
        <span>طلب صعود مايك</span>
      </button>
      <button id="callVideoBtn" class="btn-neon-action video-btn">
        <span>📷</span>
        <span>طلب صعود كاميرا</span>
      </button>
    </div>

    <!-- Chat Messages Window -->
    <main class="chat-window">
      <div class="chat-messages" id="chatMessages">
        <!-- Messages will be injected here dynamically -->
      </div>

      <!-- Chat Input Controls -->
      <div class="chat-input-bar">
        <!-- Hidden File Input for fallback gallery upload -->
        <input type="file" id="fileInput" accept="image/*" style="display:none">

        <!-- Action Tools -->
        <button id="cameraSnapBtn" class="btn-circle-tool" title="التقاط صورة بكاميرا فورية">📷</button>
        <button id="micRecordBtn" class="btn-circle-tool" title="تسجيل بصمة صوتية">🎙️</button>

        <!-- Recording Bar (Visible when recording voice note) -->
        <div class="recording-bar" id="recordingBar">
          <div class="recording-dot"></div>
          <span class="recording-timer" id="recordingTimer">00:00</span>
          <div style="flex:1"></div>
          <button id="stopRecordBtn" class="btn-circle-tool" style="width:30px;height:30px;background:var(--neon-pink);color:#fff" title="إرسال البصمة">✓</button>
          <button id="cancelRecordBtn" class="btn-circle-tool" style="width:30px;height:30px;background:#333;color:#fff" title="إلغاء">✕</button>
        </div>

        <!-- Normal Text Input -->
        <input type="text" id="msgInput" class="chat-input" placeholder="اكتب رسالتك المباشرة إلى شبح..." autocomplete="off">
        <button id="sendBtn" class="btn-circle-tool btn-send-msg" title="إرسال">➤</button>
      </div>
    </main>
  </div>

  <!-- Real-Time WebRTC Call Modal -->
  <div class="call-modal" id="callModal">
    <div class="call-header-info">
      <h2 class="call-title">💀 اتصال مباشر مع شبح</h2>
      <p class="call-status-text" id="callStatusText">بانتظار موافقة شبح...</p>
    </div>

    <div class="video-grid">
      <!-- Remote Developer Feed (or Ghost Mask if hidden) -->
      <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
      <div id="skullMaskView" class="remote-skull-mask">
        <img src="/static/assets/skull.svg" alt="Ghost Disguise Mask">
        <div class="mask-label">💀 هوية المطور مشفرة [شبح]</div>
      </div>

      <!-- Visitor Local Video Preview -->
      <video id="localVideo" class="local-video-preview" autoplay playsinline muted></video>
    </div>

    <div class="call-controls-row">
      <button id="toggleMicBtn" class="btn-call-ctrl" title="كتم/تفعيل المايك">🎙️</button>
      <button id="toggleVideoBtn" class="btn-call-ctrl" title="إيقاف/تفعيل الكاميرا">📷</button>
      <button id="hangupBtn" class="btn-call-ctrl btn-hangup" title="إنهاء المكالمة">📞</button>
    </div>
  </div>

  <!-- Camera Snapshot Modal -->
  <div class="camera-snap-modal" id="cameraSnapModal">
    <h3 style="color:#00f3ff;margin-top:10px;">📷 التقاط صورة مباشرة للمطور</h3>
    <video id="snapVideo" class="snap-video-feed" autoplay playsinline></video>
    <div style="display:flex;gap:15px;margin-bottom:20px;">
      <button id="takeSnapBtn" class="btn-neon-action" style="padding:12px 30px;font-size:16px;">📸 التقاط وإرسال</button>
      <button id="closeSnapBtn" class="btn-neon-action video-btn" style="padding:12px 25px;">إلغاء</button>
    </div>
  </div>

  <!-- Banned Screen (Full overlay if user is banned) -->
  <div class="banned-screen" id="bannedScreen">
    <div class="banned-icon">🚫</div>
    <h1 style="color:#ff3344;font-size:28px;margin-bottom:10px;">تم حظرك نهائياً</h1>
    <p style="color:#8b9bb4;max-width:350px;">تم منعك من الوصول إلى منصة شبح بقرار من الإدارة والمطور.</p>
  </div>

  <!-- Muted Toast Notification -->
  <div class="muted-toast" id="mutedToast">
    🔇 تم كتمك بواسطة المطور. لا يمكنك الإرسال أو التحدث.
  </div>

  <!-- Application Script -->
  <script src="/static/js/app.js?v=20260919-3"></script>
</body>
</html>
