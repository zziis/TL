<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم شبح | GHOST CONTROL CENTER</title>
  <link rel="stylesheet" href="/static/css/neon.css">
  <link rel="stylesheet" href="/static/admin/admin.css">
  <link rel="icon" type="image/svg+xml" href="/static/assets/skull.svg">
</head>
<body>

  <!-- Incoming Call Ring Alert Overlay -->
  <div class="incoming-call-alert" id="incomingCallAlert">
    <div class="alert-call-title">📞 طلب اتصال جديد!</div>
    <div class="alert-call-sub">
      المستخدم: <strong id="callerName" style="color:#fff">...</strong> | 
      النوع: <strong id="callTypeSpan" style="color:#00f3ff">...</strong>
    </div>
    <div class="alert-call-buttons">
      <button class="btn-accept-call" id="btnAcceptCall">✓ قبول المكالمة</button>
      <button class="btn-reject-call" id="btnRejectCall">✕ رفض</button>
    </div>
  </div>

  <div class="admin-layout">
    <!-- Panel 1: Online Users & Moderation -->
    <aside class="panel-card">
      <div class="panel-header">
        <div class="panel-title">
          <span>👥</span>
          <span>الزوار المتصلين</span>
        </div>
        <span class="status-badge" id="userCount">0 متصل</span>
      </div>
      <div class="user-list" id="userList">
        <!-- Injected dynamically -->
      </div>
    </aside>

    <!-- Panel 2: Live WebRTC Call Studio -->
    <main class="panel-card" style="display: flex; flex-direction: column;">
      <div class="panel-header">
        <div class="panel-title">
          <span>💀</span>
          <span>غرفة الاتصال المباشر (زلزال)</span>
        </div>
        <span style="font-size: 12px; color: var(--neon-cyan);" id="devCallStatus">جاهز • في وضع التخفي</span>
      </div>

      <div class="video-studio-box">
        <video id="visitorVideo" class="visitor-remote-feed" autoplay playsinline></video>
        <div class="dev-stealth-banner">
          <span>🛡️</span>
          <span>هويتك مخفية برمز زلزال</span>
        </div>
      </div>

      <div class="dev-controls-bar">
        <button id="toggleMaskBtn" class="btn-dev-action stealth-active">
          💀 قناع زلزال: مفعل (أنت مخفي)
        </button>
        <button id="devHangupBtn" class="btn-dev-action end-call">
          📞 إنهاء المكالمة
        </button>
      </div>
    </main>

    <!-- Panel 3: Direct Messages & Media Stream -->
    <section class="panel-card">
      <div class="panel-header">
        <div class="panel-title">
          <span>💬</span>
          <span>سجل الرسائل والوسائط</span>
        </div>
      </div>

      <div class="admin-chat-feed" id="adminChatFeed">
        <!-- Injected dynamically -->
      </div>

      <div class="chat-input-bar">
        <input type="text" id="devMsgInput" class="chat-input" placeholder="رد على المستخدم بهوية زلزال...">
        <button id="devSendBtn" class="btn-circle-tool btn-send-msg">➤</button>
      </div>
    </section>
  </div>

  <section class="panel-card" style="margin:18px;">
    <div class="panel-header"><div class="panel-title">📱 إدارة متجر APK</div></div>
    <form id="apkAdminForm" style="display:grid;gap:10px;padding:12px;">
      <input id="apkName" required placeholder="اسم التطبيق" class="chat-input">
      <input id="apkVersion" placeholder="الإصدار - مثال 1.0.0" class="chat-input">
      <input id="apkDesc" placeholder="وصف مختصر" class="chat-input">
      <label>صورة التطبيق <input id="apkIcon" type="file" accept="image/*" required></label>
      <label>ملف APK <input id="apkFile" type="file" accept=".apk,application/vnd.android.package-archive" required></label>
      <button class="btn-dev-action" type="submit">＋ نشر التطبيق</button>
    </form>
    <div id="apkAdminList" style="display:grid;gap:8px;padding:12px;"></div>
  </section>

  <script src="/static/admin/admin.js?v=20260919-apk1"></script>
</body>
</html>
