services:
  - type: web
    name: shabah-neon-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEVELOPER_ID
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false
